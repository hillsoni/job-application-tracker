<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if instance %}Edit{% else %}Add{% endif %} Application</title>
</head>
<body>
    <h1>{% if instance %}Edit{% else %}Add{% endif %} Application</h1>
    <p><a href="{% url 'dashboard' %}">← Back to dashboard</a></p>

    <form method="post">
        {% csrf_token %}

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        <label>Company Name</label><br>
        <input type="text" name="company_name" value="{{ instance.company_name|default:'' }}" required><br><br>

        <label>Role</label><br>
        <input type="text" name="role" value="{{ instance.role|default:'' }}" required><br><br>

        <label>Status</label><br>
        <select name="status" required>
            {% for value, label in status_choices %}
                <option value="{{ value }}" {% if instance.status == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select><br><br>

        <label>Applied Date</label><br>
        <input type="date" name="applied_date" value="{{ instance.applied_date|date:'Y-m-d'|default:'' }}" max="{% now 'Y-m-d' %}" required><br><br>

        <label>Notes</label><br>
        <textarea name="notes">{{ instance.notes|default:'' }}</textarea><br><br>

        <button type="submit">Save</button>
        {% if instance %}
            &nbsp;
            <button type="submit" name="action" value="delete" style="color: red;" onclick="return confirm('Are you sure you want to delete this application?');">Delete</button>
        {% endif %}
    </form>
</body>
</html>
